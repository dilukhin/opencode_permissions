name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check Stage 0 inventory CLI
        run: python tools/stage0_inventory.py --help

  opencode-runtime:
    name: OpenCode ${{ matrix.target }} compatibility runtime proof
    strategy:
      fail-fast: false
      matrix:
        target: [current, '1.18.32']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Resolve exact current target from compatibility registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          root = Path("tests/compatibility")
          registry = json.loads((root / "registry.json").read_text(encoding="utf-8"))
          version = registry["current_target"] if "${{ matrix.target }}" == "current" else "${{ matrix.target }}"
          profile = json.loads((root / registry["profiles"][version]).read_text(encoding="utf-8"))
          asset = profile["release_artifacts"]["linux_x64"]
          print(f"OPENCODE_TARGET_VERSION={version}")
          print(f"OPENCODE_TARGET_SHA256={asset['sha256']}")
          print(f"OPENCODE_TARGET_ASSET={asset['name']}")
          PY
      - name: Download exact current OpenCode release artifact
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$OPENCODE_TARGET_ASSET"
          curl -fL --retry 3 --retry-all-errors \
            -o "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v$OPENCODE_TARGET_VERSION/$OPENCODE_TARGET_ASSET"
          echo "$OPENCODE_TARGET_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/opencode-current"
          tar -xzf "$archive" -C "$RUNNER_TEMP/opencode-current"
          binary="$(find "$RUNNER_TEMP/opencode-current" -type f -name opencode -print -quit)"
          test -n "$binary"
          chmod +x "$binary"
          test "$($binary --version)" = "$OPENCODE_TARGET_VERSION"
          echo "OPENCODE_RUNTIME_BINARY=$binary" >> "$GITHUB_ENV"
      - name: Run non-destructive permission lifecycle proof on exact target
        shell: bash
        run: |
          set -euo pipefail
          python tests/compatibility/run_runtime_revalidation.py \
            --opencode "$OPENCODE_RUNTIME_BINARY" \
            --expected-version "$OPENCODE_TARGET_VERSION" \
            --repo-root "$GITHUB_WORKSPACE"

  opencode-windows-native-runtime:
    name: OpenCode 1.18.32 Windows native permission runtime proof
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download and verify exact official Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $profile = Get-Content tests/compatibility/profiles/opencode-1.18.32.json -Raw | ConvertFrom-Json
          if ($profile.opencode_version -ne '1.18.32') { throw 'Unexpected compatibility profile' }
          $asset = $profile.release_artifacts.windows_x64
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Uri "https://github.com/anomalyco/opencode/releases/download/v1.18.32/$($asset.name)" -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $asset.sha256) { throw "Windows asset SHA-256 mismatch: $actual" }
          $directory = Join-Path $env:RUNNER_TEMP 'opencode-windows-1.18.32'
          Expand-Archive -Path $archive -DestinationPath $directory
          $binary = Get-ChildItem $directory -Recurse -File -Filter opencode.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $binary) { throw 'OpenCode executable missing from official archive' }
          if ((& $binary --version) -ne '1.18.32') { throw 'OpenCode version mismatch' }
          "OPENCODE_RUNTIME_BINARY=$binary" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Observe native allow, deny, ask and one-time reply
        shell: pwsh
        run: |
          $shellPath = (Get-Command powershell.exe).Source
          python tests/compatibility/run_windows_native_probe.py --opencode $env:OPENCODE_RUNTIME_BINARY --shell $shellPath
