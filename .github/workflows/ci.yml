name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Keep latest for drift detection; 24.04 retains the exact non-symlink
        # system-executable profile required by the positive DC-4 identity tests.
        os: [ubuntu-latest, ubuntu-24.04, windows-latest]
        python: ['3.11', '3.14']

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run regression tests
        env:
          OPENCODE_DC4_REQUIRE_EXACT_PROFILE: ${{ matrix.os == 'ubuntu-24.04' && '1' || '0' }}
        run: python -m unittest discover -s tests -v
      - name: Check Stage 0 inventory CLI
        run: python tools/stage0_inventory.py --help

  runtime-targets:
    name: Resolve distinct exact OpenCode runtime targets
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      targets: ${{ steps.versions.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
      - id: versions
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          registry = json.loads(Path('tests/compatibility/registry.json').read_text(encoding='utf-8'))
          versions = list(dict.fromkeys([registry['current_target'], '1.18.32']))
          assert all(re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', value) and value in registry['profiles'] for value in versions)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('targets=' + json.dumps(versions) + '\n')
          PY

  opencode-runtime:
    needs: runtime-targets
    name: OpenCode ${{ matrix.target }} compatibility runtime proof
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.runtime-targets.outputs.targets) }}
    # DC-4 proves an exact non-symlink executable profile, not arbitrary changes
    # to the system utilities selected by ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Resolve exact current target from compatibility registry
        shell: bash
        env:
          OPENCODE_VERSION_SELECTOR: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os
          from pathlib import Path
          root = Path("tests/compatibility")
          registry = json.loads((root / "registry.json").read_text(encoding="utf-8"))
          version = os.environ['OPENCODE_VERSION_SELECTOR']
          profile = json.loads((root / registry["profiles"][version]).read_text(encoding="utf-8"))
          asset = profile["release_artifacts"]["linux_x64"]
          print(f"OPENCODE_TARGET_VERSION={version}")
          print(f"OPENCODE_TARGET_SHA256={asset['sha256']}")
          print(f"OPENCODE_TARGET_ASSET={asset['name']}")
          PY
      - name: Download exact current OpenCode release artifact
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$OPENCODE_TARGET_ASSET"
          if ! curl -fL --retry 3 --retry-all-errors \
            -o "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v$OPENCODE_TARGET_VERSION/$OPENCODE_TARGET_ASSET"; then
            # Same official release asset, independently read back via Connector.
            # Never substitute another version/mirror or relax the digest check.
            test "$OPENCODE_TARGET_VERSION" = '1.18.32'
            test "$OPENCODE_TARGET_ASSET" = 'opencode-linux-x64.tar.gz'
            curl -fL --max-time 90 -H 'Accept: application/octet-stream' \
              -o "$archive" 'https://api.github.com/repos/anomalyco/opencode/releases/assets/580000044'
          fi
          echo "$OPENCODE_TARGET_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/opencode-current"
          tar -xzf "$archive" -C "$RUNNER_TEMP/opencode-current"
          binary="$(find "$RUNNER_TEMP/opencode-current" -type f -name opencode -print -quit)"
          test -n "$binary"
          chmod +x "$binary"
          test "$($binary --version)" = "$OPENCODE_TARGET_VERSION"
          echo "OPENCODE_RUNTIME_BINARY=$binary" >> "$GITHUB_ENV"
      - name: Run non-destructive permission lifecycle proof on exact target
        shell: bash
        run: |
          set -euo pipefail
          python tests/compatibility/run_runtime_revalidation.py \
            --opencode "$OPENCODE_RUNTIME_BINARY" \
            --expected-version "$OPENCODE_TARGET_VERSION" \
            --repo-root "$GITHUB_WORKSPACE"

  opencode-windows-native-runtime:
    name: OpenCode 1.18.32 Windows native permission runtime proof
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download and verify exact official Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $profile = Get-Content tests/compatibility/profiles/opencode-1.18.32.json -Raw | ConvertFrom-Json
          if ($profile.opencode_version -ne '1.18.32') { throw 'Unexpected compatibility profile' }
          $asset = $profile.release_artifacts.windows_x64
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          try {
            Invoke-WebRequest -TimeoutSec 60 -Uri "https://github.com/anomalyco/opencode/releases/download/v1.18.32/$($asset.name)" -OutFile $archive
          } catch {
            # Official API route to exactly the same release asset (not a mirror).
            if ($asset.name -ne 'opencode-windows-x64.zip') { throw }
            Invoke-WebRequest -TimeoutSec 90 -Headers @{Accept='application/octet-stream'} `
              -Uri 'https://api.github.com/repos/anomalyco/opencode/releases/assets/580003748' -OutFile $archive
          }
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $asset.sha256) { throw "Windows asset SHA-256 mismatch: $actual" }
          $directory = Join-Path $env:RUNNER_TEMP 'opencode-windows-1.18.32'
          Expand-Archive -Path $archive -DestinationPath $directory
          $binary = Get-ChildItem $directory -Recurse -File -Filter opencode.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $binary) { throw 'OpenCode executable missing from official archive' }
          if ((& $binary --version) -ne '1.18.32') { throw 'OpenCode version mismatch' }
          "OPENCODE_RUNTIME_BINARY=$binary" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Observe native allow, deny, ask and one-time reply
        shell: pwsh
        run: |
          $shellPath = (Get-Command powershell.exe).Source
          python tests/compatibility/run_windows_native_probe.py --opencode $env:OPENCODE_RUNTIME_BINARY --shell $shellPath
      - name: Verify reversible Windows native diagnostics installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:RUNNER_TEMP 'native-diagnostics-project'
          New-Item -ItemType Directory -Path $project | Out-Null
          python tools/windows_native_diagnostics.py enable --project $project --opencode $env:OPENCODE_RUNTIME_BINARY
          if ($LASTEXITCODE -ne 0) { throw 'Enable failed' }
          $status = python tools/windows_native_diagnostics.py status --project $project | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $status.state -ne 'INSTALLED') { throw 'Status mismatch' }
          python tools/windows_native_diagnostics.py disable --project $project
          if ($LASTEXITCODE -ne 0 -or (Test-Path (Join-Path $project 'opencode.json'))) { throw 'Disable failed' }
          Set-Content -Path (Join-Path $project 'opencode.json') -Value '{"permission":{"bash":"deny"}}'
          python tools/windows_native_diagnostics.py enable --project $project --opencode $env:OPENCODE_RUNTIME_BINARY
          if ($LASTEXITCODE -ne 2) { throw 'Existing project config was not preserved' }
          if ((Get-Content (Join-Path $project 'opencode.json') -Raw) -notmatch '"bash":"deny"') { throw 'Existing config changed' }
          exit 0
